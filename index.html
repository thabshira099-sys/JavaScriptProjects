<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist</title>
    <link href="./public/output.css" rel="stylesheet">
</head>
<body class="min-h-screen p-4  justify-center items-center flex bg-gray-100">
    <div class="bg-white rounded-xl p-6 sm:p-8 shadow-lg w-full max-w-md gap-4  ">
        <h1 class="text-blue-800 text-3xl sm:5xl font-bold text-center ">To Do List</h1>
        <div class="flex flex-row">
            <input id="inputTask"
                   type="text"
                   placeholder="what needs to be done?"
                   class="w-full flex-1 min-w-0 rounded-tl-xl rounded-bl-xl p-3 border border-black"
                >
            <button id="add"
                    class="p-3 bg-blue-950 text-white text-center"
            >Add</button>
        </div>
        
        <ul id="taskList"
             class="space-y-3"></ul>
             <p id="taskCount"
                 class="mt-2 text-center">0/0 todos completed</p>
                 
    </div>
    <script src="./script.js"></script>
</body>
</html>
