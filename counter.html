<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CounterApp</title>
      <link href="./public/output.css" rel="stylesheet">
</head>
<body class="w-full min-h-screen flex items-center bg-gray-100 justify-center">
    <div id="counter"
        class="bg-white p-4 sm:px-8 shadow-lg rounded-xl text-center mb-4">
        <h1 class="text-3xl sm:text-4xl font-bold text-blue-950 mb-4">Counter</h1>
        <p id="count"
              class="text-5xl text-green-500 font-bold">0</p>
        <div class="flex flex-col sm:flex-row  gap-3 mt-4">
            <button id="decrease"
                    class="w-full flex-1 justify-start px-6 py-3 border border-blue-900">DECREASE</button>
                    <button id="increase"
                    class="w-full flex-1 justify-start px-6 py-3 border border-blue-900">INCREASE</button>
                    <button id="reset"
                    class="w-full flex-1 justify-start px-6 py-3 border border-blue-900">RESET</button>
        </div>
    </div>
<script src="./script.js"></script>
</body>
</html>
